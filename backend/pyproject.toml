[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.3",
    "django-environ>=0.14.0",
    "psycopg[binary]>=3.3.9",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle errors and warnings
    "F",       # pyflakes: unused imports/variables, undefined names
    "I",       # isort: import order
    "UP",      # pyupgrade: modern syntax for the target Python
    "B",       # flake8-bugbear: likely bugs
    "DJ",      # flake8-django: Django-specific mistakes
    "SIM",     # flake8-simplify
    "RUF",     # ruff's own rules
]
ignore = [
    "E501",    # line length is handled by the formatter
    "RUF012",  # Django uses mutable class attributes (REQUIRED_FIELDS, Meta.constraints) by design
]

[tool.ruff.lint.isort]
known-first-party = ["config", "accounts"]

[tool.ruff.format]
quote-style = "double"
